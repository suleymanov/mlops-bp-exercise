name: Tests

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MODEL_BUCKET: mlops-zoomcamp-my-code-1790549480

    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC subject
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | python -m json.tool

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::539850719165:role/mlops-bp-role
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pytest ruff scikit-learn boto3 deepdiff

      - run: make check
